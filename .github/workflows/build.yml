# Régénère donnees/voyage.json dès que les sources changent, pour que la version
# publiée sur Pages ne puisse pas se désynchroniser de source/.
name: build

on:
  push:
    branches: [main]
    paths:
      - 'source/**'
      - 'photos/**'
      - 'outils/build.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Construire
        run: python3 outils/build.py

      - name: Publier si le contenu a changé
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add donnees/voyage.json
          if git diff --staged --quiet; then
            echo "Rien à publier."
          else
            git commit -m "Build automatique"
            git push
          fi
